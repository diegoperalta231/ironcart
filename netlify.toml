# IRONCART · despliegue de producción (Netlify sirve el frontend; la API es una Supabase Edge Function)
# - Frontend: deploy/index.html (compilado y probado; generado con
#     VITE_API_URL=https://stabmugohevmexcrbcwa.supabase.co/functions/v1/api VITE_ROUTER=hash \
#     node scripts/local/build-frontend.mjs --single && cp dist-single/index.html deploy/)
# - API: supabase/functions/api (ver README › Despliegue).
# Para desplegar TODO en Netlify (Vite + Netlify Functions) usa netlify.funciones.toml.
[build]
  command = "echo 'Sitio precompilado en deploy/index.html'"
  publish = "deploy"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-6MuIpQdbkyFys5CvqlWpAMFBwnA66G2EM3xhuI6H7oA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://stabmugohevmexcrbcwa.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
